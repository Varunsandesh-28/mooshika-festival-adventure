kind = "web"
previewPath = "/"
title = "Mooshika Maze"
description = "A festive Ganesh Chaturthi browser game where players guide Mooshika through five temple mazes, collect modaks, avoid festival obstacles, and deliver them to Lord Ganesha."
version = "1.0.0"
id = "artifacts/mooshika-maze"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20203

[services.development]
run = "pnpm --filter @workspace/mooshika-maze run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mooshika-maze", "run", "build" ]
serve = "static"
publicDir = "artifacts/mooshika-maze/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20203"
BASE_PATH = "/"
